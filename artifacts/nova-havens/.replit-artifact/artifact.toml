kind = "web"
previewPath = "/"
title = "Nova Havens"
version = "1.0.0"
id = "artifacts/nova-havens"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22035

[services.development]
run = "pnpm --filter @workspace/nova-havens run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nova-havens", "run", "build" ]
serve = "static"
publicDir = "artifacts/nova-havens/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22035"
BASE_PATH = "/"
