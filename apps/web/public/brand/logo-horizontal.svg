    <path d="M50 90C25 70 10 55 10 40C10 28 18 20 28 20C35 20 42 25 50 34C58 25 65 20 72 20C82 20 90 28 90 40C90 55 75 70 50 90Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- House inside heart -->
    <g>
      <!-- Roof -->
      <path d="M40 48L50 38L60 48" fill="currentColor" stroke="none"/>

      <!-- House body -->
      <rect x="40" y="48" width="20" height="22" fill="currentColor"/>

      <!-- Door -->
      <rect x="47.5" y="56" width="5" height="14" fill="white" opacity="0.3"/>

      <!-- Windows -->
      <rect x="43" y="52" width="3.5" height="3.5" fill="white" opacity="0.6"/>
      <rect x="53.5" y="52" width="3.5" height="3.5" fill="white" opacity="0.6"/>
      <rect x="43" y="62" width="3.5" height="3.5" fill="white" opacity="0.6"/>
      <rect x="53.5" y="62" width="3.5" height="3.5" fill="white" opacity="0.6"/>
    </g>
  </g>

  <!-- Text: Nova Havens -->
  <text x="130" y="85" font-family="Plus Jakarta Sans, -apple-system, system-ui, sans-serif" font-size="56" font-weight="800" fill="currentColor" letter-spacing="-0.5">Nova</text>
  <text x="130" y="85" font-family="Plus Jakarta Sans, -apple-system, system-ui, sans-serif" font-size="56" font-weight="800" fill="#D4A24C" letter-spacing="-0.5">
    <tspan x="345">Havens</tspan>
  </text>
</svg>
